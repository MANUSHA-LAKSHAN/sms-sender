
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>TextFlow — SMS Sender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #131b2e;
      border: 1px solid #283650;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #2563eb;
      font-size: 25px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 6px;
    }

    .status {
      display: flex;
      gap: 9px;
      align-items: center;
      background: #172c2c;
      border: 1px solid #245047;
      border-radius: 12px;
      padding: 12px;
      color: #86efac;
      font-size: 13px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    input, textarea {
      display: block;
      width: 100%;
      border: 1px solid #334155;
      background: #0b1222;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font: inherit;
      outline: none;
      margin-bottom: 20px;
    }

    input:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px #3b82f622;
    }

    textarea {
      min-height: 145px;
      resize: vertical;
      line-height: 1.6;
    }

    .hint {
      color: #94a3b8;
      font-size: 12px;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .counter {
      color: #94a3b8;
      text-align: right;
      font-size: 12px;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      color: white;
      background: #2563eb;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(.99);
    }

    .secondary {
      background: #26344d;
      margin-top: 10px;
    }

    .secondary:hover {
      background: #334155;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      color: #64748b;
      font-size: 12px;
      text-align: center;
      margin-top: 22px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">
      <div class="logo-icon">✉</div>
      <div>
        <h1>TextFlow</h1>
        <div class="subtitle">Simple SMS Message Sender</div>
      </div>
    </div>

    <div class="status">
      <span>●</span>
      <span>Device SMS mode · No API connected</span>
    </div>

    <form id="smsForm">
      <label for="phone">Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="+94771234567"
        autocomplete="tel"
        required
      >
      <div class="hint">
        උදාහරණය: +94771234567 හෝ 0771234567
      </div>

      <label for="smsText">Your Message</label>
      <textarea
        id="smsText"
        placeholder="ඔයාගේ message එක මෙතන ලියන්න..."
        required
        maxlength="1000"
      ></textarea>

      <div class="counter" id="counter">0 / 1000 characters</div>

      <button type="submit">✉ Open SMS App</button>
      <button type="button" class="secondary" id="clearBtn">
        Clear Form
      </button>

      <div class="message" id="feedback" role="status"></div>
    </form>

    <div class="footer">
      TextFlow v1.0<br>
      SMS charges may apply. Review your message before sending.
    </div>
  </main>

  <script>
    const form = document.getElementById("smsForm");
    const phoneInput = document.getElementById("phone");
    const smsText = document.getElementById("smsText");
    const counter = document.getElementById("counter");
    const feedback = document.getElementById("feedback");

    function showMessage(text, success = false) {
      feedback.style.display = "block";
      feedback.style.background = success ? "#14352b" : "#42232b";
      feedback.style.color = success ? "#86efac" : "#fda4af";
      feedback.textContent = text;
    }

    function normalizeSriLankanNumber(value) {
      let number = value.replace(/[\s()-]/g, "");

      if (/^0\d{9}$/.test(number)) {
        number = "+94" + number.slice(1);
      } else if (/^94\d{9}$/.test(number)) {
        number = "+" + number;
      }

      // Sri Lankan mobile numbers: +94 followed by 7 and 8 digits
      if (!/^\+947\d{8}$/.test(number)) {
        return null;
      }

      return number;
    }

    smsText.addEventListener("input", () => {
      counter.textContent =
        `${smsText.value.length} / 1000 characters`;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const number = normalizeSriLankanNumber(phoneInput.value);
      const message = smsText.value.trim();

      if (!number) {
        showMessage(
          "වලංගු ශ්‍රී ලංකා mobile number එකක් ඇතුළත් කරන්න."
        );
        return;
      }

      if (!message) {
        showMessage("Message එකක් ලියන්න.");
        return;
      }

      const smsLink =
        "sms:" + number + "?body=" + encodeURIComponent(message);

      showMessage(
        "SMS app එක විවෘත කිරීමට උත්සාහ කරනවා. Message එක පරීක්ෂා කර Send කරන්න.",
        true
      );

      window.location.href = smsLink;
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      form.reset();
      counter.textContent = "0 / 1000 characters";
      feedback.style.display = "none";
    });
  </script>
</body>
</html>
